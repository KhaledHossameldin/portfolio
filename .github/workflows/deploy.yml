name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build static export
        working-directory: app
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.CONTACT_API_URL }}
        run: npm run build
      - name: AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      # Two passes over disjoint prefixes. Content-hashed assets are immutable;
      # HTML (and the rest) must revalidate so new deploys show immediately.
      # Assets first, so freshly-synced HTML never references a chunk not yet up.
      - name: Sync immutable assets
        run: >
          aws s3 sync app/out/_next/static "s3://${{ vars.S3_BUCKET }}/_next/static"
          --delete
          --cache-control "public, max-age=31536000, immutable"
      - name: Sync HTML + the rest (short TTL)
        run: >
          aws s3 sync app/out "s3://${{ vars.S3_BUCKET }}"
          --delete
          --exclude "_next/static/*"
          --cache-control "public, max-age=0, must-revalidate"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CF_DIST_ID }}" --paths "/*"

      # Slack notify (#deployments). Plain curl + jq — no extra action to SHA-pin.
      # Dynamic values pass via env (never interpolate untrusted ${{ }} into run:);
      # webhook only ever referenced as the secret, never echoed (curl -sS, no set -x).
      - name: Notify Slack — success
        if: success()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."; exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          MSG="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          TEXT=":white_check_mark: *Deploy succeeded* — \`$REPO\`
          *Branch* \`$BRANCH\` · *Commit* \`$SHORT_SHA\` — $MSG
          *By* $ACTOR
          <$RUN_URL|View run> · <https://www.khaledhossameldin.com|Live site>"
          jq -n --arg text "$TEXT" '{text:$text}' \
            | curl -sS -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"

      - name: Notify Slack — failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification."; exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          MSG="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          TEXT=":x: *Deploy failed* — \`$REPO\`
          *Branch* \`$BRANCH\` · *Commit* \`$SHORT_SHA\` — $MSG
          *By* $ACTOR
          <$RUN_URL|View run> — one click to debug"
          jq -n --arg text "$TEXT" '{text:$text}' \
            | curl -sS -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"
